<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GestoTrafic · CRM para gestorías de tráfico | WhiteMoon</title>
<meta name="description" content="Demo de CRM para gestorías de tráfico con Calculadora ITP integrada. Hecho por WhiteMoon Agencia IA.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<div class="demo-seal">DEMO <span>· Hecho por WhiteMoon</span></div>

<div class="login-wrap">
  <form class="login-card" id="login-form" autocomplete="off">
    <div class="login-logo">
      <!-- width/height son las dimensiones reales del archivo: dan la relación
           de aspecto al navegador y evitan el salto de layout mientras carga.
           El tamaño en pantalla lo pone el CSS. -->
      <img class="login-logo-img" src="assets/img/logo-gestotrafic.png"
           alt="GestoTrafic" width="480" height="363" decoding="async">
      <div class="login-logo-txt">
        <strong>GestoTrafic</strong>
        <small>CRM para gestorías de tráfico</small>
      </div>
    </div>

    <div class="field">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" name="usuario" placeholder="gestor" required autofocus>
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="••••" required>
    </div>

    <button type="submit" class="btn btn-full" id="login-btn">Entrar al panel</button>

    <div class="login-err hidden" id="login-err"></div>

    <div class="login-demo-hint">
      <b>Credenciales de demostración</b><br>
      Administrador · <b>admin</b> / <b>demo</b><br>
      Gestor · <b>gestor</b> / <b>demo</b> · <b>marcos</b> / <b>demo</b>
    </div>

    <div class="login-foot">
      Demo comercial · <b style="color:var(--p2)">WhiteMoon Agencia IA</b><br>
      No conecta con DGT ni con la Agencia Tributaria
    </div>
  </form>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script>
(function () {
  // Si ya hay sesión abierta, ir directo al panel.
  if (GTAuth.getSession()) { location.replace('app.html'); return; }

  var form = document.getElementById('login-form');
  var err  = document.getElementById('login-err');
  var btn  = document.getElementById('login-btn');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var usuario = document.getElementById('usuario').value.trim();
    var password = document.getElementById('password').value;

    err.classList.add('hidden');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';

    try {
      // Las credenciales se verifican en el servidor, no aquí.
      await GTAuth.login(usuario, password);
      location.href = 'app.html';
    } catch (ex) {
      err.textContent = ex.message || 'No se pudo iniciar sesión';
      err.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Entrar al panel';
    }
  });
})();
</script>

</body>
</html>
