<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GestoTrafic · Panel</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<div class="demo-seal">DEMO <span>· Hecho por WhiteMoon</span></div>

<div class="shell">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <!-- En la cabecera del menú va solo la marca: el logotipo completo, a
           los 36 px que caben aquí, dejaría el texto ilegible. -->
      <img class="sidebar-logo-img" src="assets/img/logo-gestotrafic-marca.png"
           alt="GestoTrafic" width="144" height="155" decoding="async">
      <div>
        <strong>GestoTrafic</strong>
        <small>Gestoría de tráfico</small>
      </div>
    </div>

    <nav class="nav" id="nav">
      <a href="#/dashboard" data-route="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        Dashboard
      </a>
      <a href="#/clientes" data-route="clientes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>
        Clientes
      </a>
      <a href="#/expedientes" data-route="expedientes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>
        Expedientes
      </a>
      <a href="#/gest-ia" data-route="gest-ia" class="nav-ia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.4"/></svg>
        Alta con Gest-IA
      </a>
      <a href="#/calculadora" data-route="calculadora">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15v4M8 19h4"/></svg>
        Calculadora ITP
      </a>
      <a href="#/kanban" data-route="kanban">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="11" rx="1"/><rect x="17" y="4" width="4" height="7" rx="1"/></svg>
        Kanban
      </a>
      <a href="#/gestores" data-route="gestores" id="nav-gestores" class="hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Gestores
      </a>
    </nav>

    <div class="sidebar-user">
      <div class="avatar" id="user-avatar">··</div>
      <div class="sidebar-user-info">
        <strong id="user-nombre">—</strong>
        <small id="user-rol">—</small>
      </div>
      <button class="logout-btn" id="logout" title="Cerrar sesión" aria-label="Cerrar sesión">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </aside>

  <main class="main" id="view">
    <div class="empty"><div class="spinner" style="margin:0 auto"></div></div>
  </main>

</div>

<!-- config → auth → api: api.js necesita la sesión guardada por auth.js
     para autenticar el cliente de Supabase antes de la primera consulta. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<!-- servicio antes que tramites: el catálogo de trámites monta con él los
     desplegables de servicio en el momento de evaluarse. -->
<script src="assets/js/servicio.js"></script>
<script src="assets/js/tramites.js"></script>
<script src="assets/js/gestia.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/contrato.js"></script>
<script src="assets/js/oegam.js"></script>
<script src="assets/js/honorarios.js"></script>
<script src="assets/js/validaciones.js"></script>
<script src="assets/js/app.js"></script>

</body>
</html>
